pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Toolchain provisioning for CI (runners ship JDK 21; the build pins a JDK 17 toolchain).
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "wizardreal"

include("wizardreal-common")
project(":wizardreal-common").projectDir = file("wizardreal/common")
include("wizardreal-fabric")
project(":wizardreal-fabric").projectDir = file("wizardreal/fabric")
include("wizardreal-forge")
project(":wizardreal-forge").projectDir = file("wizardreal/forge")

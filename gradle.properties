# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.daemon=false

# Minecraft / toolchain (1.20.1)
minecraft_version=1.20.1
# Mojang official mappings + Parchment (parameter names / javadoc), layered in
# gradle/loom-conventions.gradle. Latest Parchment release for 1.20.1.
parchment_version=2023.09.03
loader_version=0.16.10

# Forge for Minecraft 1.20.1 (the "NeoForge-era" Forge 47.x line)
forge_version=47.3.22
forge_group=net.minecraftforge

# Architectury
architectury_version=9.2.14
fabric_api_version=0.92.2+1.20.1
# Mod Menu (Fabric config screen); optional dev-only integration
modmenu_version=7.2.2

# VoiceCast dependency (separate repo: D:\Develop\Projects\Minecraft\voicecast;
# publish with `gradlew publishToMavenLocal` there, or point repositories at
# the CI maven once configured)
voicecast_version=0.3.2

# WizardReal
wizardreal_version=0.3.2
wizardreal_maven_group=com.theo.wizardreal
wizardreal_mod_id=wizardreal
wizardreal_mod_name=Be a Real Wizard

# Shared
mod_author=theo
mod_license=MIT

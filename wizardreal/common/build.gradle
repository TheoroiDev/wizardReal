apply from: rootProject.file("gradle/common-conventions.gradle")
apply from: rootProject.file("gradle/loom-conventions.gradle")
apply plugin: "architectury-plugin"

architectury {
    common(["fabric", "forge"])
}

// VoiceCast is a SEPARATE repo (../voicecast relative to this repo, or wherever
// it is cloned). Coordinates are published by `gradlew publishToMavenLocal`
// there; the unclassified voicecast-common artifact is the fat dev jar (bundles
// Vosk/ONNX/Concentus classes + natives), so tests need nothing extra.
def voicecastVersion = rootProject.voicecast_version

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "dev.architectury:architectury:${rootProject.architectury_version}"

    compileOnly "com.theo.voicecast:voicecast-common-1.20.1:${voicecastVersion}"
    testImplementation "com.theo.voicecast:voicecast-common-1.20.1:${voicecastVersion}"
    testRuntimeOnly "com.theo.voicecast:voicecast-common-1.20.1:${voicecastVersion}"
}

// S9 production-semantics rematch harness (issue #30 R-5, gated lab tool):
// forward the CLI gate flags into the test JVM, e.g.
//   gradlew :wizardreal-common:test --tests "*S9ProductionRematch*" -Ds9prod.rematch=true
tasks.named("test", Test).configure {
    ["s9prod.rematch", "s9prod.ws"].each { key ->
        def value = System.getProperty(key)
        if (value != null) systemProperty key, value
    }
}

// ---- Maven publication --------------------------------------------------
// Mirrors the voicecast-common publish block: publish the plain unclassified
// common jar so non-MC consumers (the lab/java-harness recognition harness,
// future tooling) can resolve the pure-JVM subset (G2p, api Pronunciation/
// SpellRegistry, matcher contract types) from mavenLocal by coordinate
// com.theo.wizardreal:wizardreal-common-1.20.1. Do NOT publish via
// components.java: Loom's default main artifact for a common subproject is
// the ghost unclassified jar that never exists (same reasoning as voicecast).
apply plugin: "maven-publish"

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = "wizardreal-common-${rootProject.minecraft_version}"
            artifact(tasks.named("jar")) { classifier = "" }
            artifact(tasks.named("sourcesJar")) { classifier = "sources" }
            pom {
                name = "WizardReal Common"
                description = "Game-side spells/chant logic for Minecraft - pure-JVM subset (g2p, api) usable without Minecraft."
            }
        }
    }
}
